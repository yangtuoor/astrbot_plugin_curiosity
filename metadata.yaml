name: astrbot_plugin_curiosity
display_name: 好奇心
short_desc: 自己上网翻新东西，看见有意思的就攒着，回头讲给你听
desc: 定时挑方向联网搜，把有意思的点拆条存库、按专名去重，攒到了就用自己的语气主动讲。支持千帆/博查/SearXNG/自定义接口/AstrBot 自带搜索五种后端，可让 AI 自行探索方向，可联动 QQ 空间发说说，也能被自然语言触发。
author: yangtuoor
version: 1.0.0
repo: https://github.com/yangtuoor/astrbot_plugin_curiosity
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - webchat
tags:
  - 主动
  - 搜索
  - 拟人
help: |
  指令：
    /翻翻 [方向]     立刻出去翻一轮，不给方向就按兴趣挑
    /攒了什么        看看手里有多少还没讲的
    /讲讲            马上挑最有意思的讲给你听
    /发空间          把最有趣的一条发到 QQ 空间
    /翻翻状态        最近翻得怎么样
    /清空攒的        把没讲的都扔了
  自然语言：
    直接问「有什么新鲜事」「你最近翻到啥」「发个说说」就行，模型会自己调对应工具。
  说明：
    插件会按 interval_hours 自动翻。攒够 deliver_threshold 条、
    且不在免打扰时段时，主动把话讲给 target_umo。
    打开 quiet「看心情讲」后由它自己决定什么时候开口；
    打开 Qzone 联动后，评分够高的条目会自动发一条说说。
    讲过的条目永久标记，不会重复讲。
